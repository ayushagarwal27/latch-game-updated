<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css">
    <title>Latch - Open World Game</title>
    <style>
      /* ── Wallet screen ─────────────────────────────────────────────────── */
      #wallet-screen {
        position: fixed;
        inset: 0;
        background: #11131a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        z-index: 60;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #fff;
      }
      #wallet-screen h2 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #fff;
      }
      #wallet-screen .badge {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: #1a3a1a;
        color: #4caf50;
        border: 1px solid #4caf5055;
        border-radius: 20px;
        padding: 3px 10px;
      }
      .wallet-buttons {
        display: flex;
        gap: 20px;
      }
      .wallet-btn {
        background: #1c1f2a;
        border: 2px solid #333a4a;
        border-radius: 12px;
        padding: 18px 32px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        color: #fff;
        font-family: inherit;
        font-size: 14px;
        letter-spacing: 0.04em;
        transition: border-color 0.12s, transform 0.12s;
        min-width: 130px;
      }
      .wallet-btn:hover:not(:disabled) {
        border-color: #4d96ff;
        transform: translateY(-2px);
      }
      .wallet-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .wallet-btn .icon {
        font-size: 32px;
        line-height: 1;
      }
      #wallet-status {
        font-size: 13px;
        color: #aab2c0;
        text-align: center;
        max-width: 340px;
        min-height: 18px;
      }
      #wallet-status.error  { color: #ff6b6b; }
      #wallet-status.ok     { color: #4caf50; }
      #wallet-connected-bar {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      #wallet-connected-bar .pubkey {
        font-size: 13px;
        color: #4caf50;
        letter-spacing: 0.04em;
      }
      #enter-btn {
        background: #4d96ff;
        border: none;
        border-radius: 8px;
        padding: 10px 36px;
        color: #fff;
        font-family: inherit;
        font-size: 14px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 0.12s;
      }
      #enter-btn:hover { background: #6aaaff; }

      /* ── Character select (unchanged) ─────────────────────────────────── */
      #char-select {
        position: fixed;
        inset: 0;
        background: #11131a;
        display: none; /* shown only after wallet connects */
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        z-index: 50;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #fff;
      }
      #char-select h2 {
        margin: 0;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 20px;
        color: #aab2c0;
      }
      #char-select .cards { display: flex; gap: 36px; }
      .char-card {
        background: #1c1f2a;
        border: 2px solid #333a4a;
        border-radius: 12px;
        padding: 20px 30px 16px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        color: #fff;
        transition: border-color 0.12s, transform 0.12s;
      }
      .char-card:hover { border-color: #4d96ff; transform: translateY(-3px); }
      .char-card .thumb {
        width: 96px;
        height: 96px;
        image-rendering: pixelated;
        background-repeat: no-repeat;
        background-position: 0 0;
        background-size: 576px 1248px;
      }
      .char-card .thumb.spearman { background-image: url("/assets/Spearman.png"); }
      .char-card .thumb.orc      { background-image: url("/assets/orc.png"); }
      .char-card .label { font-size: 15px; letter-spacing: 0.04em; }
    </style>
</head>

<body>

<!-- ── 1. Wallet connect screen ─────────────────────────────────────────── -->
<div id="wallet-screen">
  <h2>Connect Wallet</h2>
  <span class="badge">Devnet only</span>

  <!-- Populated dynamically by main.js after detecting installed extensions -->
  <div id="wallet-list" class="wallet-buttons"></div>

  <p id="wallet-status">Choose a wallet to continue</p>

  <!-- Shown for RETURNING users -->
  <div id="wallet-connected-bar" style="display:none; flex-direction:column; align-items:center; gap:10px;">
    <p id="wallet-pubkey-display" style="font-size:13px; color:#4caf50; letter-spacing:0.04em;"></p>
    <button id="enter-btn">Enter Game →</button>
  </div>

  <!-- Shown for NEW users (username registration) -->
  <div id="register-form" style="display:none; flex-direction:column; align-items:center; gap:12px;">
    <p style="font-size:13px; color:#aab2c0;">New here — pick a username to get started</p>
    <div style="display:flex; gap:8px; align-items:center;">
      <input
        id="username-input"
        type="text"
        maxlength="20"
        placeholder="e.g. shadow_spear"
        style="
          background:#1c1f2a; border:2px solid #333a4a; border-radius:8px;
          color:#fff; font-size:14px; padding:8px 12px; outline:none;
          font-family:inherit; width:200px;
        "
      />
      <button id="register-btn" style="
        background:#4d96ff; border:none; border-radius:8px;
        padding:9px 20px; color:#fff; font-family:inherit;
        font-size:13px; cursor:pointer; letter-spacing:0.04em;
      ">Create</button>
    </div>
    <p id="register-status" style="font-size:12px; color:#ff6b6b; min-height:16px;"></p>
  </div>
</div>

<!-- ── 2. Character select ──────────────────────────────────────────────── -->
<div id="char-select">
  <h2>Choose your fighter</h2>
  <div class="cards">
    <button class="char-card" data-sprite="Spearman">
      <span class="thumb spearman"></span>
      <span class="label">Spearman</span>
    </button>
    <button class="char-card" data-sprite="orc">
      <span class="thumb orc"></span>
      <span class="label">Orc</span>
    </button>
  </div>
</div>

<!-- ── 3. Lobby overlay ─────────────────────────────────────────────────── -->
<div id="lobby-overlay" style="
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 70;
  align-items: center;
  justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
">
</div>

<style>
  .lobby-box {
    background: #11131a;
    border: 2px solid #333a4a;
    border-radius: 14px;
    padding: 28px 36px;
    min-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    color: #fff;
  }
  .lobby-box h3 {
    margin: 0;
    font-size: 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #aab2c0;
  }
  .lobby-wager-info { margin: 0; font-size: 13px; color: #aab2c0; }
  .lobby-wager-info strong { color: #4d96ff; }
  .lobby-list { display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
  .lobby-battle-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #1c1f2a;
    border-radius: 8px;
    padding: 10px 14px;
  }
  .lobby-player { flex: 1; font-size: 13px; }
  .lobby-wager  { font-size: 12px; color: #4caf50; }
  .lobby-join-btn {
    background: #4d96ff;
    border: none;
    border-radius: 6px;
    padding: 6px 16px;
    color: #fff;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .lobby-join-btn:hover:not(:disabled) { background: #6aaaff; }
  .lobby-join-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .lobby-empty { color: #555; font-size: 13px; text-align: center; margin: 12px 0; }
  .lobby-waiting { text-align: center; font-size: 14px; color: #aab2c0; margin: 8px 0; }
  .lobby-hint { text-align: center; }
  .lobby-actions { display: flex; gap: 10px; justify-content: center; }
  .lobby-actions button {
    background: #1c1f2a;
    border: 2px solid #333a4a;
    border-radius: 8px;
    padding: 10px 22px;
    color: #fff;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.1s;
  }
  .lobby-actions button:hover:not(:disabled) { border-color: #4d96ff; }
  .lobby-actions button:disabled { opacity: 0.5; cursor: not-allowed; }
  #lobby-create-btn { border-color: #4d96ff; }
  .lobby-status { font-size: 12px; text-align: center; min-height: 16px; margin: 0; }
</style>

<!-- ── 4. Scene transition prompt ──────────────────────────────────────── -->
<div id="input-box" style="display: none">
  <h4>Do you want to join the battle ?</h4>
  <button id="yes">Yes</button>
  <button id="no">No</button>
</div>

<!-- ── 4. Chat input ────────────────────────────────────────────────────── -->
<div id="chat-input-container" style="
  display: none;
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  background: rgba(0,0,0,0.75);
  border-radius: 8px;
  padding: 6px 12px;
  align-items: center;
  gap: 8px;
  font-family: sans-serif;
">
  <span style="color:#aaa; font-size:12px;">Say:</span>
  <input id="chat-input" type="text" maxlength="80"
    placeholder="Enter to send · Esc to cancel"
    style="background:transparent; border:none; outline:none; color:#fff; font-size:13px; width:260px;"
  />
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
